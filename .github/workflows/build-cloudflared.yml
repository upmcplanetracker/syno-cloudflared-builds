name: Build Cloudflared SPK (DS224+)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Runs automatically every Sunday at midnight

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: ghcr.io/synocommunity/spksrc

    permissions:
      contents: write

    steps:
      - name: Get latest cloudflared version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: cloudflare/cloudflared
          releases-only: true
        id: cloudflared-version

      - name: Get latest release in THIS fork
        uses: oprypin/find-latest-tag@v1
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          releases-only: true
        id: fork-version

      - name: Check if update is needed
        id: check-version
        run: |
          UPSTREAM="${{ steps.cloudflared-version.outputs.tag }}"
          FORK="${{ steps.fork-version.outputs.tag }}"
          echo "Upstream: $UPSTREAM | Current Fork Release: $FORK"
          
          if [ "$UPSTREAM" != "$FORK" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "Already on latest version ($UPSTREAM). Skipping build."
          fi

      - name: Pull SynoCommunity spksrc
        if: steps.check-version.outputs.build_needed == 'true'
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          depth: 1
          branch: 'master'
          owner: 'SynoCommunity'
          repository: 'spksrc'

      - name: Prepare build environment
        if: steps.check-version.outputs.build_needed == 'true'
        run: cd spksrc/ && make setup

      - name: Cache toolchain
        if: steps.check-version.outputs.build_needed == 'true'
        uses: actions/cache@v4
        with:
          path: spksrc/distrib/toolchain
          key: toolchain-geminilake

      - name: Update versions in Makefiles
        if: steps.check-version.outputs.build_needed == 'true'
        run: |
          TAG="${{ steps.cloudflared-version.outputs.tag }}"
          RAW_VERS="${TAG#v}"
          
          sed -i "s/^PKG_VERS = .*/PKG_VERS = ${RAW_VERS}/" spksrc/cross/cloudflared/Makefile
          sed -i "s/^SPK_VERS = .*/SPK_VERS = ${RAW_VERS}/" spksrc/spk/cloudflared/Makefile

      - name: Update digests
        if: steps.check-version.outputs.build_needed == 'true'
        run: cd spksrc/cross/cloudflared && make digests

      - name: Build SPK for geminilake (DS224+)
        if: steps.check-version.outputs.build_needed == 'true'
        run: |
          cd spksrc/spk/cloudflared
          make arch-geminilake

      - name: Calculate SHA256 Checksums
        if: steps.check-version.outputs.build_needed == 'true'
        id: sha256
        run: |
          cd spksrc/packages
          echo 'SUMS<<EOF' >> "$GITHUB_OUTPUT"
          sha256sum *.spk >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check-version.outputs.build_needed == 'true'
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: spksrc/packages/*.spk
          tag: ${{ steps.cloudflared-version.outputs.tag }}
          name: "cloudflared ${{ steps.cloudflared-version.outputs.tag }}"
          body: |
            Automated build of cloudflared ${{ steps.cloudflared-version.outputs.tag }} for Synology (geminilake / DS224+).
            
            ### Checksum (SHA256)
            ```
            ${{ steps.sha256.outputs.SUMS }}
            ```
